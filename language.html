<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Language</title>

  <style>

  body{
    margin:0;
    font-family:Arial;
    background:#f1f3f6;
  }

  .header{
    background:white;
    padding:15px;
    display:flex;
    align-items:center;
    gap:15px;
    box-shadow:0 1px 5px rgba(0,0,0,0.1);
  }

  .back-btn{
    background:#2874f0;
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
  }

  .title{
    font-size:20px;
    font-weight:bold;
  }

  .search-box{
    margin:15px;
  }

  .search-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    box-sizing:border-box;
    font-size:15px;
  }

  .language-list{
    margin:15px;
    background:white;
    border-radius:15px;
    padding:10px;
  }

  .language-item{
    padding:15px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    font-size:16px;
  }

  .language-item:last-child{
    border-bottom:none;
  }

  .language-item:hover{
    background:#f5f5f5;
  }

  </style>

</head>

<body>

<!-- HEADER -->

<div class="header">

  <button class="back-btn"
          onclick="history.back()">

    ⬅ Back

  </button>

  <div class="title">
    Change Language
  </div>

</div>

<!-- SEARCH -->

<div class="search-box">

  <input type="text"
         placeholder="Search Language">

</div>

<!-- LANGUAGE LIST -->

<div class="language-list">

  <div class="language-item">
    English
  </div>

  <div class="language-item">
    Hindi
  </div>

  <div class="language-item">
    Urdu
  </div>

  <div class="language-item">
    Bengali
  </div>

  <div class="language-item">
    Tamil
  </div>

  <div class="language-item">
    Telugu
  </div>


</div>

</body>

</html>
