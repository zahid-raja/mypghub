<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Property - MyPGHub</title>
  <link rel="stylesheet" href="add-room-style.css">
</head>
<body>

  <div class="header-bar">
    <button type="button" class="back-btn" onclick="window.handleSmartBack()">⬅️ Back</button>
    MyPGHub — List Your Property
  </div>

  <div class="main-container">
    
    <div id="part1-verification">
      <h2 class="step-title">Step 1: Owner Verification & Location Lock</h2>
      
      <div class="form-group">
        <label>Your Full Name (Owner Name) <span style="color:red;">*</span></label>
        <input type="text" id="ownerName" class="form-control" placeholder="E.g., Ramesh Kumar" required>
      </div>

      <div class="form-group">
        <label>Property / PG Name <span style="color:red;">*</span></label>
        <input type="text" id="houseName" class="form-control" placeholder="E.g., Krishna Niwas PG" required>
      </div>

      <div class="form-group">
        <label>Email ID <span style="color:red;">*</span></label>
        <input type="email" id="ownerEmail" class="form-control" placeholder="owner@email.com" required>
      </div>

      <div class="form-group">
        <label>Live Property Location <span style="color:red;">*</span></label>
        <button type="button" class="btn btn-primary btn-block" onclick="window.fetchLiveLocation()">
          📍 Click Here to Lock Live GPS Location
        </button>
        <div id="locationConfirmationBox" class="location-box">
          <p id="locationStatusText" style="margin:0; font-size:13px; font-weight:bold; color:#c0392b;">
            ⚠️ Live GPS Location missing! Clicking the button above is mandatory.
          </p>
        </div>
      </div>

      <div class="form-group">
        <label>Detailed Address / Landmark <span style="color:red;">*</span></label>
        <input type="text" id="manualAddress" class="form-control" placeholder="E.g., Lane No. 3, Near Hanuman Mandir" required>
      </div>

      <div class="form-group">
        <label>Pincode & City <span style="color:red;">*</span></label>
        <input type="text" id="pincodeCity" class="form-control" placeholder="E.g., 842001, Muzaffarpur" required>
      </div>

      <div class="form-group">
        <label>🔒 Aadhaar Card Verification (Optional)</label>
        <div class="upload-zone">
          <div style="display:flex; gap:10px; justify-content:center;">
            <label class="btn btn-secondary" style="cursor:pointer;">
              📸 Open Camera
              <input type="file" accept="image/*" capture="camera" style="display:none;" onchange="window.validateAadhaarPhoto(this)">
            </label>
            <label class="btn btn-secondary" style="cursor:pointer;">
              📁 Upload File
              <input type="file" accept="image/*" style="display:none;" onchange="window.validateAadhaarPhoto(this)">
            </label>
          </div>
          <p id="aadhaarStatusText" style="font-size:12px; margin-top:8px; color:#7f8c8d;">Aadhaar is not mandatory.</p>
          <img id="aadhaarPreviewImg" class="preview-img" alt="Aadhaar Preview">
        </div>
      </div>

      <div class="form-group">
        <label>Mobile Number <span style="color:red;">*</span></label>
        <div style="display: flex; gap: 10px;">
          <input type="tel" id="ownerPhone" class="form-control" placeholder="10 Digit Mobile Number" maxlength="10" required>
          <button type="button" class="btn btn-primary" style="white-space:nowrap;" onclick="window.simulateOTPSend()">Send OTP</button>
        </div>
        <div id="otpInputBox" style="display: none; margin-top: 10px;">
          <div style="display: flex; gap: 10px;">
            <input type="text" id="otpCode" class="form-control" placeholder="Enter 6-Digit OTP" maxlength="6">
            <button type="button" class="btn btn-success" onclick="window.verifyOTPAndProceed()">Verify & Next ➔</button>
          </div>
        </div>
      </div>
    </div>

    <div id="part2-roomDetails" class="hidden-section">
      <h2 class="step-title" style="color: #27ae60;">Step 2: Room, Facilities & Rules Details</h2>
      
      <div class="form-group">
        <label>🏠 Main Front/Building Image <span style="color:red;">*</span></label>
        <input type="file" id="mainPhotoInput" accept="image/*" class="form-control" required>
      </div>

      <div class="form-group">
        <label>📸 Gallery Images <span style="color:red;">*</span></label>
        <input type="file" id="galleryPhotos" accept="image/*" class="form-control" multiple required>
      </div>

      <div class="form-group">
        <label>PG Categorization <span style="color:red;">*</span></label>
        <select id="pgType" class="form-control" required>
          <option value="">-- Select Target Gender --</option>
          <option value="Boys">Boys PG</option>
          <option value="Girls">Girls PG</option>
          <option value="CoEd">Co-Ed</option>
        </select>
      </div>

      <div class="form-group">
        <label>Allowed Sharing Type <span style="color:red;">*</span></label>
        <select id="sharingType" class="form-control" required>
          <option value="">-- Select Sharing Configuration --</option>
          <option value="Single">Single Sharing</option>
          <option value="Double">Double Sharing</option>
          <option value="Triple">Triple Sharing</option>
          <option value="Multiple">Multiple Options</option>
        </select>
      </div>

      <div class="form-group">
        <label>Room Specifications:</label>
        <div class="checkbox-grid">
          <label class="checkbox-item"><input type="checkbox" id="roomAttachedBathroom"> 🚿 Attached Bathroom</label>
          <label class="checkbox-item"><input type="checkbox" id="roomBalcony"> 🌅 Balcony Available</label>
          <label class="checkbox-item"><input type="checkbox" id="roomFullyFurnished"> 🛋️ Fully Furnished</label>
        </div>
      </div>

      <div class="form-group">
        <label>Available Amenities:</label>
        <div class="checkbox-grid">
          <label class="checkbox-item"><input type="checkbox" id="facWiFi"> 🌐 Wi-Fi</label>
          <label class="checkbox-item"><input type="checkbox" id="facCooler"> ❄️ Cooler</label>
          <label class="checkbox-item"><input type="checkbox" id="facAC"> ⚡ AC</label>
          <label class="checkbox-item"><input type="checkbox" id="facBed"> 🛏️ Bed</label>
          <label class="checkbox-item"><input type="checkbox" id="facTableChair"> 🪑 Table & Chair</label>
          <label class="checkbox-item"><input type="checkbox" id="facCupboard"> 🚪 Cupboard</label>
          <label class="checkbox-item"><input type="checkbox" id="facWashingMachine"> 🧺 Washing Machine</label>
          <label class="checkbox-item"><input type="checkbox" id="facRO"> 🧊 RO Water</label>
          <label class="checkbox-item"><input type="checkbox" id="facPowerBackup"> 🔋 Power Backup</label>
          <label class="checkbox-item"><input type="checkbox" id="facMattress"> 🛏️ Mattress</label>
          <label class="checkbox-item"><input type="checkbox" id="facPillow"> 😴 Pillow</label>
          <label class="checkbox-item"><input type="checkbox" id="facRefrigerator"> 🧊 Refrigerator</label>
          <label class="checkbox-item"><input type="checkbox" id="facParking"> 🅿️ Parking Facility</label>
        </div>
      </div>

      <div class="form-group">
        <label>Is Food/Mess Service Provided? <span style="color:red;">*</span></label>
        <select id="foodService" class="form-control" onchange="window.toggleMessOptions(this.value)" required>
          <option value="">-- Choose Option --</option>
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
        <div id="messOptionsPanel" class="nested-mess-box" style="display: none;">
          <label>Meals Included:</label>
          <div style="display: flex; gap: 15px; margin-bottom: 12px;">
            <label><input type="checkbox" id="messBreakfast"> Breakfast</label>
            <label><input type="checkbox" id="messLunch"> Lunch</label>
            <label><input type="checkbox" id="messDinner"> Dinner</label>
          </div>
          <label>Food Category:</label>
          <select id="foodCategory" class="form-control" style="background: white;">
            <option value="Veg">Pure Vegetarian</option>
            <option value="Both">Veg & Non-Veg</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Night Gate Closing Time <span style="color:red;">*</span></label>
        <select id="gateTime" class="form-control" required>
          <option value="10 PM">10:00 PM</option>
          <option value="11 PM" selected>11:00 PM</option>
          <option value="12 AM">12:00 Midnight</option>
          <option value="24x7">24x7 Open</option>
        </select>
      </div>

      <div class="form-group">
        <label>Strict Rules Enforcement:</label>
        <div class="checkbox-grid">
          <label class="checkbox-item"><input type="checkbox" id="ruleNoSmoking" checked> 🚭 No Smoking</label>
          <label class="checkbox-item"><input type="checkbox" id="ruleNoMusic" checked> 🔇 No Loud Music</label>
          <label class="checkbox-item"><input type="checkbox" id="ruleNoCooking"> 🍳 No Cooking In Room</label>
        </div>
      </div>

      <div class="form-group">
        <label>Monthly Room/Bed Rent (INR) <span style="color:red;">*</span></label>
        <input type="number" id="roomPrice" class="form-control" placeholder="E.g., 6500" required>
      </div>

      <div class="form-group">
        <label>Short Description / Rules <span style="color:red;">*</span></label>
        <textarea id="description" class="form-control" rows="3" placeholder="Write terms..." required></textarea>
      </div>

      <button type="button" class="btn btn-success btn-block" style="padding:15px; font-size:16px;" onclick="window.finalSubmitForm()">
        🚀 Final Submit Property
      </button>
    </div>

  </div>

  <script type="module" src="add-room-firebase.js"></script>
</body>
</html>
